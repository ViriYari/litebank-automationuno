name: Selenium Async Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Levantar servicios
        run: |
          docker compose up -d --build
          echo "Servicios iniciando..."

      - name: Esperar conectividad total
        run: |
          echo "Esperando que los servicios respondan..."
          for i in {1..40}; do
            if nc -z localhost 8080 && nc -z localhost 9092 && nc -z localhost 5173; then
              echo "✓ Todos los servicios están listos."
              exit 0
            fi
            echo "Intento $i - Esperando servicios (Backend 8080, Kafka 9092, Frontend 5173)..."
            sleep 5
          done
          echo "✗ Timeout: Servicios no disponibles"
          docker ps
          exit 1

      - name: Debug logs worker
        if: always()
        run: |
          echo "--- Logs del worker ---"
          docker logs qa-backend-worker --tail 50

      - name: Diagnóstico de conexión Kafka
        run: |
          echo "Buscando red de Docker..."
          NETWORK_NAME=$(docker network ls --format "{{.Name}}" | grep qa-network)
          echo "Red encontrada: $NETWORK_NAME"
          
          echo "Probando conexión hacia el Broker..."
          docker run --rm --network $NETWORK_NAME busybox nc -zv kafka 29092
          
          if [ $? -eq 0 ]; then
            echo "✓ Conectividad confirmada."
          else
            echo "✗ Error: No hay conexión con el Broker desde esta red."
            exit 1
          fi

      - name: Ejecutar tests
        run: mvn test
        env:
          BASE_URL: http://localhost:5173

      - name: Apagar Docker
        if: always()
        run: docker compose down