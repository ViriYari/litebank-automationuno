name: Selenium Async Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Levantar Docker (Kafka + frontend + todo)
      - name: Levantar servicios
        run: docker compose up -d --build

      # 4. Ver contenedores (debug)
      - name: Ver contenedores
        run: docker ps

      # 5. Esperar backend
      - name: Wait for backend-server
        run: |
          echo "Esperando que el puerto 8080 responda..."
          for i in {1..60}; do
            # nc -z verifica si el puerto está abierto sin enviar datos
            if nc -z localhost 8080 > /dev/null 2>&1; then
              echo "✓ Backend server puerto 8080 abierto y listo"
              exit 0
            fi
            echo "  Intento $i - backend no responde aún..."
            sleep 3
          done
          echo "✗ Backend no respondió a tiempo"
          docker logs qa-backend-server
          exit 1
      
      # 6. Ejecutar tests con variable base URL
      - name: Ejecutar tests
        run: mvn test
        env:
          BASE_URL: http://localhost:5173
    
      # 7. Apagar servicios siempre
      - name: Apagar Docker
        if: always()
        run: docker compose down